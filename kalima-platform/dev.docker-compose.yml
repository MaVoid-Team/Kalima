name: kalima-dev
services:
  dev-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8089:80"
      - "4449:443"
    environment:
      - VITE_API_URL=/api/v1
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - dev-backend
    networks:
      - dev-network

  dev-backend:
    build:
      context: ./backend
      dockerfile: src/Dockerfile
    ports:
      - "5034:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@dev-postgres:5432/postgres?schema=kalima
      - REDIS_URL=redis://dev-redis:6379
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_NAME=${CLOUDINARY_NAME}
      - CLOUDINARY_KEY=${CLOUDINARY_KEY}
      - CLOUDINARY_SECRET=${CLOUDINARY_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME}
      - APP_URL=https://dev.kalima-edu.com
      - SUPPORT_URL=https://dev.kalima-edu.com/support
    depends_on:
      - dev-postgres
      - dev-redis
    networks:
      - dev-network
    volumes:
      - dev-uploads:/app/uploads

  dev-postgres:
    image: postgres:18-alpine
    ports:
      - "5467:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
    networks:
      - dev-network

  dev-redis:
    image: redis:8.6.0-alpine
    ports:
      - "6769:6379"
    volumes:
      - dev-redis-data:/data
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  dev-uploads:
  dev-postgres-data:
  dev-redis-data:
