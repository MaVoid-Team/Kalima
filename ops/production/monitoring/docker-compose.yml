name: kalima-monitoring
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: kalima-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./rendered/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:19090:9090"]
    networks: [monitoring]
    mem_limit: 512m
    mem_reservation: 128m
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: kalima-alertmanager
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./rendered/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:19093:9093"]
    networks: [monitoring]
    mem_limit: 128m
    mem_reservation: 32m
  grafana:
    image: grafana/grafana:11.2.0
    container_name: kalima-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:13000:3000"]
    networks: [monitoring]
    mem_limit: 384m
    mem_reservation: 96m
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: kalima-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    networks: [monitoring]
    mem_limit: 96m
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: kalima-cadvisor
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg:/dev/kmsg"]
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker:/var/lib/docker:ro", "/dev/disk:/dev/disk:ro"]
    networks: [monitoring]
    mem_limit: 192m
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: kalima-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@kalima-postgres:5432/postgres?sslmode=disable
    networks: [monitoring, data-network]
    mem_limit: 96m
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: kalima-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://kalima-redis:6379
    networks: [monitoring, data-network]
    mem_limit: 96m
networks:
  monitoring:
    name: kalima-monitoring-network
  data-network:
    external: true
    name: kalima-data-network
volumes:
  prometheus-data: {name: kalima-prometheus-data}
  grafana-data: {name: kalima-grafana-data}
  alertmanager-data: {name: kalima-alertmanager-data}
